<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServeSync — Entrar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="topbar__title">Login</span>
  </header>

  <main class="app">
    <section class="panel">
      <div class="panel__form">
        <header class="panel__header">
          <h1>Seja bem-vindo!</h1>
          <p>Entre para continuar</p>
        </header>

        <form class="form" action="../Index_clientes.html" method="get" novalidate>
          <div class="field">
            <label for="login-email">E-mail</label>
            <span class="field__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M2 6l10 7 10-7"/>
              </svg>
            </span>
            <input type="email" id="login-email" name="email" placeholder="E-mail" required>
          </div>

          <div class="field">
            <label for="login-senha">Senha</label>
            <span class="field__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="11" width="16" height="9" rx="2"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              </svg>
            </span>
            <input type="password" id="login-senha" name="senha" placeholder="Senha" required>
          </div>

          <div class="form__links">
            <a href="recuperar-email.html" class="link">Esqueceu sua senha?</a>
            <a href="home.html" class="link link--muted" data-employee-entry="true">Entrar como funcionário</a>
          </div>

          <button type="submit" class="btn btn--primary">Entrar</button>
        </form>
      </div>
    </section>


    <aside class="brand" aria-hidden="true">
      <div class="brand__logo">
        <!-- Coloque aqui a imagem da logo baixada (ex: assets/logo-serve-sync.png) -->
        <img src="img/Logosspng 1.png" alt="" class="brand__image">
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
  <script src="./login-employee.js"></script>
  <script src="blackboxai-login-router.js"></script>
</body>
</html>
